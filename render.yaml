# Render blueprint: the Boardly backend, its Postgres database and the
# website (boardly.lol).
# In Render: New → Blueprint → pick this repository. Render creates both,
# wires DATABASE_URL, and generates SECRET_KEY.
#
# Plans below are the free ones so nothing is charged by surprise. They
# are for trying things out only: a free web service sleeps when idle
# (dropping live game connections) and a free database is temporary.
# Move both to paid plans before real players use it.

databases:
  - name: boardly-db
    databaseName: boardly
    user: boardly
    plan: free
    region: singapore

services:
  - type: web
    name: boardly-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    # Keep this at one instance: live game state is held in memory.
    numInstances: 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: boardly-db
          property: connectionString
      # Behind Render's proxy, so rate limits see each player's real IP
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "5005"
      # Browser origins allowed to call the API (comma-separated). Empty
      # means any website may call it. The phone app is not a browser and
      # is unaffected either way.
      - key: CORS_ORIGINS
        sync: false

  # boardly.lol: the website. Invite links (https://boardly.lol/join/CODE)
  # open the app on a phone that has it; everyone else gets this site's
  # "get the app" page. Plain files, nothing to build.
  # This service used to publish the web version of the game. Boardly is
  # a phone app only now, so the same service serves the website instead.
  - type: web
    name: boardly-web
    runtime: static
    rootDir: website
    staticPublishPath: public
    autoDeploy: true
    domains:
      - boardly.lol
    routes:
      - type: rewrite
        source: /join/*
        destination: /join.html
    headers:
      # Apple only accepts its link file as JSON, and it has no extension
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
