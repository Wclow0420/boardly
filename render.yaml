# Render blueprint: the Boardly backend, its Postgres database and the
# web version of the app.
# In Render: New → Blueprint → pick this repository. Render creates both,
# wires DATABASE_URL, and generates SECRET_KEY.
#
# Plans below are the free ones so nothing is charged by surprise. They
# are for trying things out only: a free web service sleeps when idle
# (dropping live game connections) and a free database is temporary.
# Move both to paid plans before real players use it.

databases:
  - name: boardly-db
    databaseName: boardly
    user: boardly
    plan: free
    region: singapore

services:
  - type: web
    name: boardly-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    # Keep this at one instance: live game state is held in memory.
    numInstances: 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: boardly-db
          property: connectionString
      # Behind Render's proxy, so rate limits see each player's real IP
      - key: TRUST_PROXY
        value: "1"
      - key: PORT
        value: "5005"
      # Set this in the dashboard to the web app's address (boardly-web
      # below) so only that site can call the API from a browser.
      - key: CORS_ORIGINS
        sync: false

  # The web version of the app: static files built from the Expo project.
  - type: web
    name: boardly-web
    runtime: static
    rootDir: boardly
    buildCommand: npm ci && npm run build:web
    staticPublishPath: dist
    autoDeploy: true
    # Single-page app: table links (/join/CODE, /lobby/CODE, /game/CODE)
    # are handled in the browser, so every path serves index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      # Baked into the build. Change it here if the backend's address changes.
      - key: EXPO_PUBLIC_API_URL
        value: https://boardly-api-m3y5.onrender.com
